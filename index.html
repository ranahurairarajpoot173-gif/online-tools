<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Utility Tools - Free Tools</title>
    <style>
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .box {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background: #0ea5e9;
        }
        .result {
            margin-top: 15px;
            font-size: 15px;
            color: #38bdf8;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>My Online Tools</h1>

    <div class="container">
        <!-- Tool 1: Age Calculator -->
        <div class="box">
            <h2>Age Calculator</h2>
            <input type="date" id="dob">
            <button onclick="checkAge()">Calculate Age</button>
            <div id="ans" class="result"></div>
        </div>

        <!-- Tool 2: Password Generator -->
        <div class="box">
            <h2>Password Generator</h2>
            <input type="text" id="passwordBox" readonly placeholder="Click generate">
            <button onclick="generatePassword()">Generate Password</button>
        </div>
    </div>

    <script>
        // Age Calculator Logic
        function checkAge() {
            let dobValue = document.getElementById('dob').value;
            let ansDiv = document.getElementById('ans');

            if(!dobValue) {
                ansDiv.innerHTML = "Please select date of birth!";
                ansDiv.style.color = "red";
                return;
            }

            let birthDate = new Date(dobValue);
            let today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                let lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            ansDiv.style.color = "#38bdf8";
            ansDiv.innerHTML = `You are ${years}y, ${months}m, ${days}d old!`;
        }

        // Password Generator Logic
        function generatePassword() {
            let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";
            let passwordLength = 10;
            let password = "";
            for (let i = 0; i < passwordLength; i++) {
                let randomNumber = Math.floor(Math.random() * chars.length);
                password += chars.substring(randomNumber, randomNumber + 1);
            }
            document.getElementById('passwordBox').value = password;
        }
    </script>

</body>
</html>
